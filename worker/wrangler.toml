name = "sakthi-portfolio-contact-worker"
main = "src/index.ts"
compatibility_date = "2026-01-01"

[observability]
enabled = true

[vars]
# Comma-separated allowed origins for CORS and CSRF Origin validation.
# Remove localhost origins in production if not needed, or keep separated per environment.
ALLOWED_ORIGINS = "https://sakthib.pages.dev,https://portfolio.sakthib.workers.dev,http://localhost:3000"

[[d1_databases]]
binding = "DB"
database_name = "databsa"
database_id = "56060383-8951-4823-9d73-27bc2d082f2a"

# Cloudflare Workers Rate Limiting bindings.
# Note: Worker rate limits are approximate and enforced locally per Cloudflare edge location.
[[ratelimits]]
name = "CONTACT_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "ADMIN_AUTH_LIMITER"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "ADMIN_WRITE_LIMITER"
namespace_id = "1003"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "PUBLIC_LIMITER"
namespace_id = "1004"
simple = { limit = 30, period = 60 }
